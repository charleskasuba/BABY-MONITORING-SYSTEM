<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baby Cradle Monitoring System - History</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0b1020;
            --card: rgba(255,255,255,0.06);
            --card-border: rgba(255,255,255,0.09);
            --text: #e8ecf8;
            --muted: #8b93b0;
            --accent: #6366f1;
            --accent2: #a855f7;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', 'Segoe UI', sans-serif;
            color: var(--text);
            min-height: 100vh;
            background:
                radial-gradient(900px 500px at 15% -10%, rgba(99,102,241,0.35), transparent 60%),
                radial-gradient(800px 500px at 110% 10%, rgba(168,85,247,0.25), transparent 60%),
                var(--bg);
        }
        .container { max-width: 1400px; margin: 0 auto; padding: 24px; }

        .nav {
            display: flex; align-items: center; flex-wrap: wrap; gap: 12px;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--card-border);
            backdrop-filter: blur(14px);
            border-radius: 18px; padding: 14px 22px;
            margin-bottom: 28px; position: sticky; top: 14px; z-index: 10;
        }
        .brand { display: flex; align-items: center; gap: 12px; margin-right: 24px; }
        .brand-logo {
            width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            font-size: 1.3rem; box-shadow: 0 6px 18px rgba(99,102,241,0.45);
        }
        .brand h1 { font-size: 1.15rem; font-weight: 700; }
        .brand small { display: block; color: var(--muted); font-size: 0.7rem; font-weight: 500; }
        .nav a.link {
            color: var(--muted); text-decoration: none; padding: 9px 18px;
            border-radius: 10px; font-weight: 600; font-size: 0.85rem;
            transition: all 0.25s;
        }
        .nav a.link:hover, .nav a.link.active { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; box-shadow: 0 6px 16px rgba(99,102,241,0.35); }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
            gap: 18px; margin-bottom: 28px;
        }
        .stat-card {
            background: var(--card); border: 1px solid var(--card-border);
            backdrop-filter: blur(10px); border-radius: 18px; padding: 24px;
            text-align: center; transition: transform 0.25s;
        }
        .stat-card:hover { transform: translateY(-5px); }
        .stat-value {
            font-size: 2.1rem; font-weight: 800;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
        }
        .stat-label { color: var(--muted); margin-top: 8px; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 1.2px; font-weight: 700; }

        .panel {
            background: var(--card); border: 1px solid var(--card-border);
            backdrop-filter: blur(10px); border-radius: 20px; padding: 24px;
            margin-bottom: 28px;
        }
        .panel h2 { font-size: 1.05rem; font-weight: 700; margin-bottom: 18px; display: flex; align-items: center; gap: 10px; }
        .panel h2 .bar { width: 4px; height: 18px; border-radius: 4px; background: linear-gradient(180deg, var(--accent), var(--accent2)); }
        .chart-wrapper { height: 380px; }

        .filters {
            display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
            margin-bottom: 20px;
        }
        select {
            padding: 11px 16px; border-radius: 12px; border: 1px solid var(--card-border);
            background: rgba(0,0,0,0.3); color: var(--text); font-size: 0.9rem;
            cursor: pointer; font-family: inherit; outline: none;
        }
        .btn {
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            color: #fff; border: none; padding: 11px 22px; border-radius: 12px;
            cursor: pointer; font-weight: 700; font-size: 0.85rem; font-family: inherit;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 10px 24px rgba(99,102,241,0.4); }

        .table-wrap { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
        th, td { padding: 12px 14px; text-align: left; border-bottom: 1px solid rgba(255,255,255,0.07); }
        th { color: var(--muted); font-weight: 700; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.8px; }
        tr:hover td { background: rgba(255,255,255,0.03); }
        .tag { padding: 3px 10px; border-radius: 20px; font-size: 0.7rem; font-weight: 700; }
        .tag-on { background: rgba(245,158,11,0.14); color: #fbbf24; }
        .tag-off { background: rgba(34,197,94,0.14); color: #4ade80; }

        .footer { text-align: center; color: var(--muted); font-size: 0.75rem; padding: 18px 0 6px; }

        @media (max-width: 768px) {
            .brand h1 { display: none; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="nav">
            <div class="brand">
                <div class="brand-logo">🚼</div>
                <div>
                    <h1>Baby Cradle Monitoring</h1>
                    <small>Smart IoT Monitoring System</small>
                </div>
            </div>
            <a href="/" class="link">Dashboard</a>
            <a href="/live" class="link">Live Video</a>
            <a href="/history" class="link active">History</a>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-value" id="avg-temp">--</div>
                <div class="stat-label">Avg Temperature (°C)</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="avg-hum">--</div>
                <div class="stat-label">Avg Humidity (%)</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="max-temp">--</div>
                <div class="stat-label">Max Temperature</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="min-temp">--</div>
                <div class="stat-label">Min Temperature</div>
            </div>
        </div>

        <div class="panel">
            <h2><span class="bar"></span>Historical Trends</h2>
            <div class="chart-wrapper"><canvas id="historyChart"></canvas></div>
        </div>

        <div class="filters">
            <span style="font-weight:600; font-size:0.9rem;">Time Range:</span>
            <select id="rangeSelect">
                <option value="24">Last 24 Hours</option>
                <option value="48">Last 48 Hours</option>
                <option value="168">Last 7 Days</option>
                <option value="720">Last 30 Days</option>
            </select>
            <button class="btn" onclick="loadData()">Refresh</button>
        </div>

        <div class="panel">
            <h2><span class="bar"></span>Recent Readings</h2>
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr><th>Time</th><th>Temperature</th><th>Humidity</th><th>Motion</th><th>Sound</th><th>Diaper</th></tr>
                    </thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>
        </div>

        <div class="footer">Baby Cradle Monitoring System</div>
    </div>

    <script>
        let chart;

        async function loadData() {
            const hours = document.getElementById('rangeSelect').value;
            try {
                const response = await fetch(`/api/history?limit=${hours * 12}`);
                const data = await response.json();

                if (data && data.length > 0) {
                    const temps = data.map(d => d.temperature).filter(t => t != null);
                    const hums = data.map(d => d.humidity).filter(h => h != null);

                    if (temps.length) {
                        document.getElementById('avg-temp').textContent = (temps.reduce((a,b) => a+b, 0) / temps.length).toFixed(1);
                        document.getElementById('max-temp').textContent = Math.max(...temps).toFixed(1);
                        document.getElementById('min-temp').textContent = Math.min(...temps).toFixed(1);
                    }
                    if (hums.length) {
                        document.getElementById('avg-hum').textContent = Math.round(hums.reduce((a,b) => a+b, 0) / hums.length);
                    }

                    const recent = data.slice(-100).reverse();
                    const labels = recent.map(d => new Date(d.created_at).toLocaleString());
                    const tempData = recent.map(d => d.temperature);
                    const humData = recent.map(d => d.humidity);

                    if (chart) chart.destroy();
                    const ctx = document.getElementById('historyChart').getContext('2d');
                    chart = new Chart(ctx, {
                        type: 'line',
                        data: {
                            labels,
                            datasets: [
                                { label: 'Temperature (°C)', data: tempData, borderColor: '#f87171', tension: 0.2, yAxisID: 'y', pointRadius: 0, borderWidth: 2.5, fill: true, backgroundColor: 'rgba(248,113,113,0.08)' },
                                { label: 'Humidity (%)', data: humData, borderColor: '#38bdf8', tension: 0.2, yAxisID: 'y1', pointRadius: 0, borderWidth: 2.5, fill: true, backgroundColor: 'rgba(56,189,248,0.08)' }
                            ]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            interaction: { mode: 'index', intersect: false },
                            plugins: {
                                legend: { labels: { color: '#8b93b0', font: { family: 'Inter', weight: '600' } } }
                            },
                            scales: {
                                x: { ticks: { color: '#8b93b0', font: { family: 'Inter' } }, grid: { color: 'rgba(255,255,255,0.06)' } },
                                y: { type: 'linear', position: 'left', title: { display: true, text: '°C', color: '#8b93b0' }, min: 0, max: 40, ticks: { color: '#8b93b0' }, grid: { color: 'rgba(255,255,255,0.06)' } },
                                y1: { type: 'linear', position: 'right', title: { display: true, text: '%', color: '#8b93b0' }, min: 0, max: 100, grid: { drawOnChartArea: false }, ticks: { color: '#8b93b0' } }
                            }
                        }
                    });

                    document.getElementById('tableBody').innerHTML = data.slice(0, 50).map(r => `
                        <tr>
                            <td>${new Date(r.created_at).toLocaleString()}</td>
                            <td>${r.temperature != null ? r.temperature + '°C' : '--'}</td>
                            <td>${r.humidity != null ? r.humidity + '%' : '--'}</td>
                            <td><span class="tag ${r.motion_detected ? 'tag-on' : 'tag-off'}">${r.motion_detected ? 'Active' : 'Quiet'}</span></td>
                            <td><span class="tag ${r.sound_level ? 'tag-on' : 'tag-off'}">${r.sound_level ? 'Loud' : 'Quiet'}</span></td>
                            <td><span class="tag ${r.wetness_detected ? 'tag-on' : 'tag-off'}">${r.wetness_detected ? 'Wet' : 'Dry'}</span></td>
                        </tr>
                    `).join('');
                }
            } catch(e) { console.error(e); }
        }

        loadData();
        setInterval(loadData, 60000);
    </script>
</body>
</html>
