<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Baby Monitor - History</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .container { max-width: 1400px; margin: 0 auto; padding: 20px; }

        .nav {
            background: white; border-radius: 15px; padding: 15px 30px;
            margin-bottom: 30px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            display: flex; align-items: center; flex-wrap: wrap; gap: 10px;
        }
        .nav h1 { color: #667eea; margin-right: 40px; font-size: 1.4rem; }
        .nav a {
            color: #666; text-decoration: none; padding: 10px 20px;
            border-radius: 8px; transition: all 0.3s; font-weight: 500;
        }
        .nav a:hover, .nav a.active { background: #667eea; color: white; }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px; margin-bottom: 30px;
        }
        .stat-card {
            background: white; border-radius: 15px; padding: 25px;
            text-align: center; box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .stat-value { font-size: 2.4rem; font-weight: 700; color: #667eea; }
        .stat-label { color: #888; margin-top: 8px; font-size: 0.8rem; text-transform: uppercase; }

        .chart-container {
            background: white; border-radius: 15px; padding: 20px;
            margin-bottom: 30px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .chart-container h2 { margin-bottom: 15px; color: #333; }
        .chart-wrapper { height: 400px; }

        .filters {
            background: white; border-radius: 15px; padding: 20px;
            margin-bottom: 20px; display: flex; gap: 10px; align-items: center;
            flex-wrap: wrap; box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        select, button {
            padding: 10px 16px; border-radius: 8px; font-size: 0.9rem; cursor: pointer;
        }
        select { border: 1px solid #ddd; background: white; }
        button { background: #667eea; color: white; border: none; font-weight: 600; }
        button:hover { background: #5a67d8; }

        .table-container {
            background: white; border-radius: 15px; padding: 20px;
            overflow-x: auto; box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .table-container h2 { margin-bottom: 15px; color: #333; }
        table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
        th, td { padding: 12px 14px; text-align: left; border-bottom: 1px solid #eee; }
        th { background: #f8f9fa; font-weight: 600; color: #555; }
        tr:hover { background: #f8f9ff; }
    </style>
</head>
<body>
    <div class="container">
        <div class="nav">
            <h1>Smart Baby Monitor</h1>
            <a href="/">Dashboard</a>
            <a href="/live">Live Video</a>
            <a href="/history" class="active">History</a>
            <a href="/settings">Settings</a>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-value" id="avg-temp">--</div>
                <div class="stat-label">Avg Temperature (°C)</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="avg-hum">--</div>
                <div class="stat-label">Avg Humidity (%)</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="max-temp">--</div>
                <div class="stat-label">Max Temperature</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="min-temp">--</div>
                <div class="stat-label">Min Temperature</div>
            </div>
        </div>

        <div class="chart-container">
            <h2>Historical Trends</h2>
            <div class="chart-wrapper"><canvas id="historyChart"></canvas></div>
        </div>

        <div class="filters">
            <label style="font-weight:600;">Time Range:</label>
            <select id="rangeSelect">
                <option value="24">Last 24 Hours</option>
                <option value="48">Last 48 Hours</option>
                <option value="168">Last 7 Days</option>
                <option value="720">Last 30 Days</option>
            </select>
            <button onclick="loadData()">Refresh</button>
        </div>

        <div class="table-container">
            <h2>Recent Readings</h2>
            <table>
                <thead>
                    <tr><th>Time</th><th>Temperature</th><th>Humidity</th><th>Motion</th><th>Diaper</th></tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
    </div>

    <script>
        let chart;

        async function loadData() {
            const hours = document.getElementById('rangeSelect').value;
            try {
                const response = await fetch(`/api/history?limit=${hours * 12}`);
                const data = await response.json();

                if (data && data.length > 0) {
                    const temps = data.map(d => d.temperature).filter(t => t != null);
                    const hums = data.map(d => d.humidity).filter(h => h != null);

                    if (temps.length) {
                        document.getElementById('avg-temp').textContent = (temps.reduce((a,b) => a+b, 0) / temps.length).toFixed(1);
                        document.getElementById('max-temp').textContent = Math.max(...temps).toFixed(1);
                        document.getElementById('min-temp').textContent = Math.min(...temps).toFixed(1);
                    }
                    if (hums.length) {
                        document.getElementById('avg-hum').textContent = Math.round(hums.reduce((a,b) => a+b, 0) / hums.length);
                    }

                    const recent = data.slice(-100).reverse();
                    const labels = recent.map(d => new Date(d.created_at).toLocaleString());
                    const tempData = recent.map(d => d.temperature);
                    const humData = recent.map(d => d.humidity);

                    if (chart) chart.destroy();
                    const ctx = document.getElementById('historyChart').getContext('2d');
                    chart = new Chart(ctx, {
                        type: 'line',
                        data: {
                            labels,
                            datasets: [
                                { label: 'Temperature (°C)', data: tempData, borderColor: '#ff6384', tension: 0.15, yAxisID: 'y' },
                                { label: 'Humidity (%)', data: humData, borderColor: '#36a2eb', tension: 0.15, yAxisID: 'y1' }
                            ]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            interaction: { mode: 'index', intersect: false },
                            scales: {
                                y: { type: 'linear', position: 'left', title: { display: true, text: '°C' }, min: 0, max: 40 },
                                y1: { type: 'linear', position: 'right', title: { display: true, text: '%' }, min: 0, max: 100, grid: { drawOnChartArea: false } }
                            }
                        }
                    });

                    document.getElementById('tableBody').innerHTML = data.slice(0, 50).map(r => `
                        <tr>
                            <td>${new Date(r.created_at).toLocaleString()}</td>
                            <td>${r.temperature != null ? r.temperature + '°C' : '--'}</td>
                            <td>${r.humidity != null ? r.humidity + '%' : '--'}</td>
                            <td>${r.motion_detected ? 'Active' : 'Quiet'}</td>
                            <td>${r.wetness_detected ? 'Wet' : 'Dry'}</td>
                        </tr>
                    `).join('');
                }
            } catch(e) { console.error(e); }
        }

        loadData();
        setInterval(loadData, 60000);
    </script>
</body>
</html>
